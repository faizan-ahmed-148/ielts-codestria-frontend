<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="420" height="96" fill="none">
  <defs>
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="facetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>
    <linearGradient id="glowLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#4f46e5" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Left Icon Emblem (68x68 at x=14, y=14) -->
  <g transform="translate(14, 14)">
    <rect width="68" height="68" rx="18" fill="url(#emblemGrad)" />
    <rect width="66" height="66" x="1" y="1" rx="17" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

    <!-- Top Cap -->
    <path d="M34 16L52 26L34 36L16 26L34 16Z" fill="url(#facetLight)" />
    <path d="M34 16L52 26L34 31L16 26L34 16Z" fill="#ffffff" opacity="0.9" />

    <!-- Middle Tier -->
    <path d="M16 31.5L34 41.5L52 31.5L49 35L34 43.5L19 35L16 31.5Z" fill="url(#glowLight)" />

    <!-- Bottom Tier -->
    <path d="M19 40L34 48.5L49 40L46 43.5L34 50.5L22 43.5L19 40Z" fill="#a5b4fc" opacity="0.95" />

    <!-- Beacon Pulse -->
    <circle cx="53" cy="15" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Brand Typography -->
  <!-- "Codestria" -->
  <text x="98" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="900" fill="#0f172a" letter-spacing="-0.5">
    Codestria<tspan fill="#4f46e5">.</tspan>
  </text>

  <!-- IELTS Pill Badge -->
  <g transform="translate(235, 27)" filter="url(#badgeShadow)">
    <rect width="64" height="26" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1" />
    <text x="32" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#4338ca" text-anchor="middle" letter-spacing="1.2">
      IELTS
    </text>
  </g>

  <!-- Subtitle: Official CD Simulator -->
  <text x="99" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1.8">
    OFFICIAL CD SIMULATOR
  </text>

  <!-- Studio Link: by Codestria -->
  <g transform="translate(315, 32)">
    <circle cx="4" cy="9" r="3" fill="#6366f1" />
    <text x="13" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">
      by codestria.com
    </text>
  </g>
</svg>
