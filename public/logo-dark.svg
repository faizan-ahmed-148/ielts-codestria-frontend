<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="420" height="96" fill="none">
  <defs>
    <linearGradient id="emblemDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="facetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="glowDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Left Icon Emblem -->
  <g transform="translate(14, 14)">
    <rect width="68" height="68" rx="18" fill="url(#emblemDarkGrad)" />
    <rect width="66" height="66" x="1" y="1" rx="17" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />

    <!-- Top Cap -->
    <path d="M34 16L52 26L34 36L16 26L34 16Z" fill="url(#facetDark)" />
    <path d="M34 16L52 26L34 31L16 26L34 16Z" fill="#ffffff" opacity="0.9" />

    <!-- Middle Tier -->
    <path d="M16 31.5L34 41.5L52 31.5L49 35L34 43.5L19 35L16 31.5Z" fill="url(#glowDark)" />

    <!-- Bottom Tier -->
    <path d="M19 40L34 48.5L49 40L46 43.5L34 50.5L22 43.5L19 40Z" fill="#c7d2fe" opacity="0.95" />

    <!-- Beacon Pulse -->
    <circle cx="53" cy="15" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Brand Typography (White & Light) -->
  <text x="98" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Codestria<tspan fill="#818cf8">.</tspan>
  </text>

  <!-- IELTS Pill Badge -->
  <g transform="translate(235, 27)">
    <rect width="64" height="26" rx="6" fill="rgba(99,102,241,0.25)" stroke="rgba(165,180,252,0.4)" stroke-width="1" />
    <text x="32" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#c7d2fe" text-anchor="middle" letter-spacing="1.2">
      IELTS
    </text>
  </g>

  <!-- Subtitle: Official CD Simulator -->
  <text x="99" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.8">
    OFFICIAL CD SIMULATOR
  </text>

  <!-- Studio Link: by Codestria -->
  <g transform="translate(315, 32)">
    <circle cx="4" cy="9" r="3" fill="#38bdf8" />
    <text x="13" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">
      by codestria.com
    </text>
  </g>
</svg>
