<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <radialGradient id="ogBg" cx="20%" cy="15%" r="90%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="glowTopRight" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="rgba(99,102,241,0.35)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <radialGradient id="glowBottomLeft" cx="15%" cy="80%" r="50%">
      <stop offset="0%" stop-color="rgba(14,165,233,0.25)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
  </defs>

  <!-- Deep Tech Studio Background -->
  <rect width="1200" height="630" fill="url(#ogBg)" />
  <rect width="1200" height="630" fill="url(#glowTopRight)" />
  <rect width="1200" height="630" fill="url(#glowBottomLeft)" />

  <!-- Subtle Blueprint Grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <path d="M0 100H1200 M0 200H1200 M0 300H1200 M0 400H1200 M0 500H1200" />
    <path d="M200 0V630 M400 0V630 M600 0V630 M800 0V630 M1000 0V630" />
  </g>

  <!-- Top Brand Navigation Bar -->
  <g transform="translate(80, 70)">
    <!-- Emblem -->
    <rect width="56" height="56" rx="16" fill="url(#emblemGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    <path d="M28 14L43 22.5L28 31L13 22.5L28 14Z" fill="#ffffff" />
    <path d="M13 27L28 35.5L43 27L40 30L28 37L16 30L13 27Z" fill="#38bdf8" />
    <circle cx="44" cy="13" r="4.5" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />

    <!-- Brand Typography -->
    <text x="72" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Codestria<tspan fill="#818cf8">.</tspan>
    </text>

    <!-- IELTS Pill -->
    <rect x="210" y="16" width="68" height="28" rx="7" fill="rgba(99,102,241,0.3)" stroke="rgba(165,180,252,0.4)" stroke-width="1.5" />
    <text x="244" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#e0e7ff" text-anchor="middle" letter-spacing="1.5">
      IELTS
    </text>

    <!-- Parent Studio Link -->
    <rect x="900" y="14" width="140" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <circle cx="918" cy="30" r="4" fill="#38bdf8" />
    <text x="930" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">
      codestria.com
    </text>
  </g>

  <!-- Main Hero Headline -->
  <g transform="translate(80, 210)">
    <!-- Eyebrow Pill -->
    <rect width="360" height="34" rx="17" fill="rgba(99,102,241,0.2)" stroke="rgba(99,102,241,0.4)" stroke-width="1" />
    <text x="24" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#a5b4fc" letter-spacing="1.5">
      OFFICIAL COMPUTER-DELIVERED SIMULATOR
    </text>

    <!-- Big Headline -->
    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="url(#textGrad)" letter-spacing="-1.2">
      Master Cambridge IELTS Tests
    </text>
    <text x="0" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1.2">
      Under Real Exam Conditions.
    </text>

    <!-- Subtitle -->
    <text x="0" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
      Cambridge Books 19 down to 12 · Academic &amp; General · Instant Band 9.0 Scoring
    </text>
  </g>

  <!-- Feature Metric Pills (Bottom) -->
  <g transform="translate(80, 480)">
    <!-- Pill 1 -->
    <rect width="240" height="68" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#818cf8" letter-spacing="1">
      CAMBRIDGE PAPERS
    </text>
    <text x="24" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#ffffff">
      Volumes 19 → 12 Full
    </text>

    <!-- Pill 2 -->
    <rect x="260" width="240" height="68" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text x="284" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">
      EXAM ENGINE
    </text>
    <text x="284" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#ffffff">
      Official CD-IELTS Tools
    </text>

    <!-- Pill 3 -->
    <rect x="520" width="240" height="68" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text x="544" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#10b981" letter-spacing="1">
      BAND SCORING
    </text>
    <text x="544" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#ffffff">
      Instant TRF &amp; CEFR C1/C2
    </text>

    <!-- Domain Badge -->
    <rect x="780" width="260" height="68" rx="16" fill="rgba(79,70,229,0.25)" stroke="rgba(129,140,248,0.4)" stroke-width="1.5" />
    <text x="804" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc" letter-spacing="1">
      DIRECT ACCESS
    </text>
    <text x="804" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#ffffff">
      ielts.codestria.com
    </text>
  </g>
</svg>
